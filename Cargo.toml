[workspace]
resolver = "3"
members = [
    "apps/oziro-core",
    "apps/oziro-shell-host",
    "crates/oziro-protocol",
    "crates/oziro-services",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
