# Experimental isolated Hyprlock theme. Authentication is handled by PAM.
# No screenshot capture, external commands, grace period or custom auth scripts.
general {
    grace = 0
    hide_cursor = false
    ignore_empty_input = true
}
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}
animations {
    enabled = false
}
background {
    monitor =
    color = rgba(191f2bff)
}
label {
    monitor =
    text = O Z I R O
    color = rgba(93d9e9ff)
    font_size = 22
    font_family = sans-serif
    position = 0, 150
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgba(edf2faff)
    font_size = 62
    font_family = sans-serif
    position = 0, 66
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    outer_color = rgba(93d9e9ff)
    inner_color = rgba(252d3bff)
    font_color = rgba(edf2faff)
    fail_color = rgba(fb7185ff)
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
    position = 0, -56
    halign = center
    valign = center
}
label {
    monitor =
    text = Enter your system password to unlock
    color = rgba(a8b4c4ff)
    font_size = 13
    font_family = sans-serif
    position = 0, -114
    halign = center
    valign = center
}
